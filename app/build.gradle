plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diya.duarukub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.diya.duarukub'
        minSdk 26
        targetSdk 30
        versionCode 9
        versionName "9.0"
    }

    signingConfigs {
        fixed {
            storeFile file('duarukub.keystore')
            storePassword 'duarukub'
            keyAlias 'duarukub'
            keyPassword 'duarukub'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
