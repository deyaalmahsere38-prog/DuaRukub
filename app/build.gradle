plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diya.duarukub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.diya.duarukub'
        minSdk 26
        targetSdk 30
        versionCode 5
        versionName "5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
